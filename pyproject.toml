[project]
name = "agentic-workshop-env"
version = "0.1.0"
description = "Public environment definition for the agentic workshop Renku session"
requires-python = ">=3.12,<3.14"
dependencies = [
    # LLM client & data models
    "openai>=3.20.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    # Documents
    "pypdf>=6.19.0",
    # Data & plotting
    "numpy",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pillow>=10.4",
    # Notebooks
    "ipykernel>=7.3.0",
    "jupyter>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false      # dependencies only; the real package is installed from the private repo at launch

[[io.buildpacks.build.env]]
name = "BP_RENKU_AI_AGENTS"
value = "pi"